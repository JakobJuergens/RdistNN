url: https://JakobJuergens.github.io/RdistNN

template:
  bootstrap: 5

navbar:
  structure:
    left:  [home, reference]
    right: [github]
  components:
    github:
      icon: fa-github
      href: https://github.com/JakobJuergens/RdistNN
      aria-label: GitHub

articles:
  - title: Getting started
    contents:
      - getting-started
      - diagnostics-reporting
      - visualising-fits
      - extending
  - title: Theory & details
    contents:
      - conditional-z-estimation
      - local-iv-estimation
      - dnn-weights
      - kernel-order-tuning
      - jackknife-gen-ustats
  - title: Paper replication
    contents:
      - paper-cate-simulation

reference:
  - title: Package overview
    contents:
      - RdistNN-package

  - title: Top-level weighting API
    desc: General matrix builder + DNN convenience wrappers.
    contents:
      - cate_dnn
      - gmm_dnn
      - np_dnn
      - np_tdnn
      - plqr_dnn
      - weights_matrix
      - weights_dnn
      - weights_dnn_exact
      - weights_dnn_asymp
      - weights_tdnn
      - weights_tdnn_exact
      - weights_tdnn_asymp

  - title: Scores (U-stat kernels)
    desc: S3 spec, helpers, generics, registries, and built-in score topics.
    contents:
      - new_score
      - score_setup
      - score_order
      - score_eval
      - score_eval_batch
      - as_score
      - is_score
      - is_compiled
      - register_score
      - get_score
      - list_scores
      - starts_with("score_")      # e.g. score_cate_rho / score_cate_from_rho, score_plqr_component

  - title: GMM models
    desc: Vector-moment model objects for local GMM estimation.
    contents:
      - new_gmm_model
      - is_gmm_model
      - gmm_model_dr_iv

  - title: Distances (rankers)
    desc: S3 spec, helpers, generics, registries, and built-in distances.
    contents:
      - new_distance
      - distance_eval
      - distance_eval_batch
      - as_distance
      - is_distance
      - register_distance
      - get_distance
      - distance_names
      - distance_l2
      - distance_l1
      - distance_l2_scaled
      - distance_l1_scaled
      - distance_mahalanobis
      - dist_l2
      - dist_l1
      - dist_l2_scaled
      - dist_l1_scaled
      - order_by_l2
      - order_by_l1
      - order_by_l2_scaled
      - order_by_l1_scaled

  - title: Rank → Weight mappings
    desc: S3 spec for converting ranks to weights, plus DNN rank-weights.
    contents:
      - new_rank_weight
      - rank_weight_eval
      - rank_weight_eval_batch
      - as_rank_weight
      - is_rank_weight
      - register_rank
      - get_rank
      - rank_names
      - rank_weight_dnn_exact
      - rank_weight_dnn_asymp
      - dnn_weights_exact_full_from_ranks
      - dnn_weights_asymp_full_from_ranks
      - rank_weight_tdnn_exact
      - rank_weight_tdnn_asymp
      - dnn_weights_tdnn_exact_full_from_ranks
      - dnn_weights_tdnn_asymp_full_from_ranks
      - tdnn_rank_table_exact
      - tdnn_rank_table_asymp

  - title: Jackknife (leave-one-out)
    desc: Fast C++ path with auto fallback, slow oracle, and DNN wrappers.
    contents:
      - jackknife_fast_rank
      - jackknife_rank_full
      - jackknife_slow_rank

  - title: Plotting
    desc: >
      ggplot2-based panels for fitted objects (ggplot2 is a suggested
      dependency), and the tidy data extractors underneath them; see the
      plotting-layer plan in the repository notes.
    contents:
      - plot_estimates
      - plot_weights
      - plot_overlap
      - plot_dashboard
      - plot_conditioning
      - plot_calibration
      - plot_influence
      - plot_tdnn_scales
      - plot_tuning
      - autoplot.dnn_diagnostics
      - plot_data_estimates
      - plot_data_weights
      - plot_data_diagnostics

  - title: S3 methods
    desc: diagnostics, print, summary, confint, and predict methods for package objects.
    contents:
      - diagnostics
      - print.cate_result
      - print.gmm_result
      - print.np_result
      - print.plqr_result
      - print.score_diff_path
      - print.summary.cate_result
      - print.summary.gmm_result
      - print.tdnn_np_result
      - print.ustat_score
      - print.weights_result
      - summary.cate_result
      - summary.gmm_result
      - confint.cate_result
      - confint.gmm_result
      - coef.gmm_result
      - vcov.gmm_result
      - predict.cate_result

  - title: Kernel-order tuning
    desc: Tuning specifications, registry helpers, and paper-default rules.
    contents:
      - new_tuning
      - as_tuning
      - is_tuning
      - register_tuning
      - get_tuning
      - tuning_names
      - tuning_eval
      - tuning_dnn_paper

  - title: Simulation study
    desc: Data-generating processes and Monte Carlo harnesses for paper simulations.
    contents:
      - sim_cate_data
      - sim_cate_one_rep
      - sim_cate_run
      - sim_cate_methods
      - summarise_sim_results
      - sim_iv_data
      - sim_iv_one_rep
      - sim_iv_run
      - sim_iv_methods
      - summarise_iv_results

  - title: Demo data & utilities
    contents:
      - cate_demo_data
      - iv_demo_data
      - cate_demo_subsets
      - np_demo_data
      - np_demo_subsets
      - plqr_demo_data
      - plqr_demo_subsets
      - plqr_moment
      - ord_to_ranks
