url: https://JakobJuergens.github.io/RdistNN

template:
  bootstrap: 5

navbar:
  structure:
    left:  [home, reference]
    right: [github]
  components:
    github:
      icon: fa-github
      href: https://github.com/JakobJuergens/RdistNN
      aria-label: GitHub

articles:
  - title: Getting started
    contents:
      - getting-started
      - notation-and-conventions
      - diagnostics-reporting
      - visualising-fits
      - extending
  - title: Theory & details
    contents:
      - conditional-z-estimation
      - local-iv-estimation
      - dnn-weights
      - kernel-order-tuning
      - jackknife-gen-ustats
  - title: Paper replication
    contents:
      - paper-cate-simulation

reference:
  - title: Package overview
    contents:
      - RdistNN-package

  - title: Stable user API — estimators and weights
    desc: >
      The primary entry points expected to survive the public release:
      user-level estimators plus the DNN weight builders.
    contents:
      - cate_dnn
      - np_dnn
      - plqr_dnn
      - weights_matrix
      - weights_dnn
      - weights_dnn_exact
      - weights_dnn_asymp

  - title: Developer API — scores (U-stat kernels)
    desc: >
      Extension points for custom scores: S3 spec, helpers, generics,
      registries, and built-in score topics.
    contents:
      - new_score
      - score_setup
      - score_order
      - score_eval
      - score_eval_batch
      - as_score
      - is_score
      - is_compiled
      - register_score
      - get_score
      - list_scores
      - starts_with("score_")      # e.g. score_cate_rho / score_cate_from_rho, score_plqr_component

  - title: Experimental — local IV-GMM (companion paper)
    desc: >
      Experimental companion functionality for the GMM paper; API and
      theorem alignment may change before that paper is released.
    contents:
      - gmm_dnn
      - iv_demo_data
      - sim_iv_data
      - sim_iv_one_rep
      - sim_iv_run
      - sim_iv_methods
      - summarise_iv_results
      - new_gmm_model
      - is_gmm_model
      - gmm_model_dr_iv

  - title: Developer API — distances (rankers)
    desc: >
      Extension points for custom distances: S3 spec, helpers, generics,
      registries, and built-in distance constructors.
    contents:
      - new_distance
      - distance_eval
      - distance_eval_batch
      - as_distance
      - is_distance
      - register_distance
      - get_distance
      - distance_names
      - distance_l2
      - distance_l1
      - distance_l2_scaled
      - distance_l1_scaled
      - distance_mahalanobis

  - title: Developer API — rank → weight mappings
    desc: >
      Extension points for custom rank weights: S3 spec, evaluators,
      registry, and the single-scale DNN rank-weight constructors.
    contents:
      - new_rank_weight
      - rank_weight_eval
      - rank_weight_eval_batch
      - as_rank_weight
      - is_rank_weight
      - register_rank_weight
      - get_rank_weight
      - rank_weight_names
      - rank_weight_dnn_exact
      - rank_weight_dnn_asymp

  - title: Advanced — TDNN and jackknife-paper infrastructure
    desc: >
      Two-scale DNN estimation and the leave-one-out jackknife primitives
      supporting the generalized U-statistics companion paper.
    contents:
      - np_tdnn
      - weights_tdnn
      - weights_tdnn_exact
      - weights_tdnn_asymp
      - rank_weight_tdnn_exact
      - rank_weight_tdnn_asymp
      - plot_tdnn_scales
      - jackknife_fast_rank
      - jackknife_rank_full
      - jackknife_slow_rank

  - title: Plotting
    desc: >
      ggplot2-based panels for fitted objects (ggplot2 is a suggested
      dependency), and the tidy data extractors underneath them; see the
      plotting-layer plan in the repository notes.
    contents:
      - plot_estimates
      - plot_weights
      - plot_overlap
      - plot_dashboard
      - plot_conditioning
      - plot_calibration
      - plot_influence
      - plot_tuning
      - autoplot.dnn_diagnostics
      - plot_data_estimates
      - plot_data_weights
      - plot_data_diagnostics

  - title: S3 methods
    desc: diagnostics, print, summary, confint, and predict methods for package objects.
    contents:
      - candidate_fit
      - diagnostics
      - print.cate_result
      - print.gmm_result
      - print.np_result
      - print.plqr_result
      - print.score_diff_path
      - print.summary.cate_result
      - print.summary.gmm_result
      - print.summary.plqr_result
      - print.tdnn_np_result
      - print.ustat_score
      - print.weights_result
      - summary.cate_result
      - summary.gmm_result
      - summary.plqr_result
      - confint.cate_result
      - confint.gmm_result
      - confint.plqr_result
      - coef.cate_result
      - coef.gmm_result
      - coef.plqr_result
      - vcov.gmm_result
      - vcov.plqr_result
      - predict.cate_result
      - predict.plqr_result

  - title: Kernel-order tuning
    desc: Tuning specifications, registry helpers, and paper-default rules.
    contents:
      - new_tuning
      - as_tuning
      - is_tuning
      - register_tuning
      - get_tuning
      - tuning_names
      - tuning_eval
      - tuning_dnn_paper

  - title: Paper replication — CATE simulation study
    desc: >
      Data-generating processes and Monte Carlo harnesses mirroring the
      conditional Z-estimation paper's CATE study.
    contents:
      - sim_cate_data
      - sim_cate_one_rep
      - sim_cate_run
      - sim_cate_methods
      - summarise_sim_results

  - title: Demo data & utilities
    contents:
      - cate_demo_data
      - cate_demo_subsets
      - np_demo_data
      - np_demo_subsets
      - plqr_demo_data
      - plqr_demo_subsets
      - plqr_score_matrix
