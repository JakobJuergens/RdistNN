url: https://JakobJuergens.github.io/RdistNN

template:
  bootstrap: 5

redirects:
  - [README.html, index.html]
  - [NEWS.html, news/index.html]

navbar:
  structure:
    left:  [home, reference, articles, news]
    right: [contributing, website, github]
  components:
    contributing:
      text: Contributing
      href: https://github.com/JakobJuergens/RdistNN/blob/master/CONTRIBUTING.md
    website:
      text: Author
      href: https://jakobjuergens.com/
    github:
      icon: fa-github
      href: https://github.com/JakobJuergens/RdistNN
      aria-label: GitHub

articles:
  - title: Getting started
    contents:
      - getting-started
      - notation-and-conventions
      - diagnostics-reporting
      - visualising-fits
      - kernel-order-tuning
  - title: Weights and extension APIs
    contents:
      - dnn-weights
      - extending
      - jackknife-gen-ustats
  - title: Conditional LATE and paired inference
    contents:
      - conditional-late
      - conditional-late-inference
  - title: Experimental companion workflows
    contents:
      - conditional-z-estimation
      - local-iv-estimation
  - title: Paper replication
    contents:
      - paper-affine-replication

reference:
  - title: Package overview
    contents:
      - RdistNN-package

  - title: CATE and regression — estimators and weights
    desc: >
      The main estimation workflows: conditional average treatment
      effects, nonparametric regression, and their DNN weight builders.
    contents:
      - cate_dnn
      - np_dnn
      - np_tdnn
      - weights_matrix
      - weights_dnn
      - weights_dnn_exact
      - weights_dnn_asymp

  - title: S3 methods
    desc: Conditional-effect and regression inference, prediction, shared diagnostics and candidate views.
    contents:
      - candidate_fit
      - diagnostics
      - print.cate_result
      - print.np_result
      - np_result
      - nobs.np_result
      - print.score_diff_path
      - print.summary.cate_result
      - print.tdnn_np_result
      - print.ustat_score
      - print.weights_result
      - summary.cate_result
      - confint.cate_result
      - coef.cate_result
      - vcov.cate_result
      - predict.cate_result

  - title: Plotting
    desc: >
      ggplot2-based panels for fitted objects (ggplot2 is a suggested
      dependency), and the tidy data extractors underneath them; see the
      visualization and diagnostics articles.
    contents:
      - plot_estimates
      - plot_weights
      - plot_overlap
      - plot_dashboard
      - plot_influence
      - plot_tuning
      - autoplot.dnn_diagnostics
      - plot_data_estimates
      - plot_data_weights
      - plot_data_diagnostics

  - title: Kernel-order tuning
    desc: Tuning specifications, registry helpers, and paper-default rules.
    contents:
      - new_tuning
      - as_tuning
      - is_tuning
      - register_tuning
      - get_tuning
      - tuning_names
      - tuning_eval
      - tuning_dnn_paper

  - title: Demo data & utilities
    contents:
      - cate_demo_data
      - cate_demo_subsets
      - np_demo_data
      - np_demo_subsets

  - title: General CATE simulation tools
    desc: >
      Synthetic benchmarks and Monte Carlo summaries. The conditional Z-estimation
      paper uses the separate study-specific replication bundle.
    contents:
      - sim_cate_data
      - sim_cate_one_rep
      - sim_cate_run
      - sim_cate_methods
      - summarise_sim_results

  - title: Conditional LATE and paired ratios
    desc: >
      Supported supplied-prediction binary-IV signals and paired ratios with
      exact or asymptotic DNN weights. Shared reporting, candidate views and
      plots, with frozen-score covariance, diagnostics and the documented
      pointwise inference conditions.
    contents:
      - clate_dnn
      - iv_augmented_signals
      - affine_ratio_dnn
      - affine_ratio_result
      - clate_diagnostics
      - clate_demo_data

  - title: Experimental — ratio confidence sets
    desc: >
      Optional pointwise normal-reference inversion of paired moment
      inequalities. This helper does not establish weak-instrument-uniform
      coverage.
    contents:
      - ratio_confidence_set

  - title: Experimental — PLQR
    desc: >
      Experimental moments and density-backed uncertainty at supplied
      coefficients. The wrapper does not solve for local coefficients;
      APIs and inference interfaces may change.
    contents:
      - plqr_dnn
      - plqr_score_matrix
      - score_plqr_component
      - plqr_demo_data
      - plqr_demo_subsets
      - print.plqr_result
      - print.summary.plqr_result
      - summary.plqr_result
      - confint.plqr_result
      - coef.plqr_result
      - vcov.plqr_result
      - predict.plqr_result
      - plot_conditioning
      - plot_calibration

  - title: Experimental — local IV-GMM (companion paper)
    desc: >
      Experimental companion functionality for the GMM paper; API and
      theorem alignment may change before that paper is released.
    contents:
      - gmm_dnn
      - iv_demo_data
      - sim_iv_data
      - sim_iv_one_rep
      - sim_iv_run
      - sim_iv_methods
      - summarise_iv_results
      - new_gmm_model
      - is_gmm_model
      - gmm_model_dr_iv
      - print.gmm_result
      - print.summary.gmm_result
      - summary.gmm_result
      - confint.gmm_result
      - coef.gmm_result
      - vcov.gmm_result

  - title: Developer API — scores (U-stat kernels)
    desc: >
      Extension points for custom scores: S3 spec, helpers, generics,
      registries, and built-in score topics.
    contents:
      - new_score
      - score_setup
      - score_order
      - score_eval
      - score_eval_batch
      - as_score
      - is_score
      - is_compiled
      - register_score
      - get_score
      - list_scores
      - score_np_y
      - score_cate_rho
      - score_diff_path

  - title: Developer API — distances (rankers)
    desc: >
      Extension points for custom distances: S3 spec, helpers, generics,
      registries, and built-in distance constructors.
    contents:
      - new_distance
      - distance_eval
      - distance_eval_batch
      - as_distance
      - is_distance
      - register_distance
      - get_distance
      - distance_names
      - distance_l2
      - distance_l1
      - distance_l2_scaled
      - distance_l1_scaled
      - distance_mahalanobis

  - title: Developer API — rank → weight mappings
    desc: >
      Extension points for custom rank weights: S3 spec, evaluators,
      registry, and the single-scale DNN rank-weight constructors.
    contents:
      - new_rank_weight
      - rank_weight_eval
      - rank_weight_eval_batch
      - as_rank_weight
      - is_rank_weight
      - register_rank_weight
      - get_rank_weight
      - rank_weight_names
      - rank_weight_dnn_exact
      - rank_weight_dnn_asymp

  - title: Advanced — TDNN and jackknife-paper infrastructure
    desc: >
      Two-scale DNN estimation and the leave-one-out jackknife primitives
      supporting the generalized U-statistics companion paper.
    contents:
      - weights_tdnn
      - weights_tdnn_exact
      - weights_tdnn_asymp
      - rank_weight_tdnn_exact
      - rank_weight_tdnn_asymp
      - plot_tdnn_scales
      - jackknife_fast_rank
      - jackknife_rank_full
      - jackknife_slow_rank
