url: https://JakobJuergens.github.io/RdistNN

template:
  bootstrap: 5

navbar:
  structure:
    left:  [home, reference]
    right: [github]
  components:
    github:
      icon: fa-github
      href: https://github.com/JakobJuergens/RdistNN
      aria-label: GitHub

