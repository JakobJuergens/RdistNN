# Correctness gate; formatting is opt-in for explicitly selected files.
required-version = "==0.17.2"
target-version = "py39"
force-exclude = true
include = ["*.py"]
extend-exclude = [
  "**/inst/paper-replication/affine/source/**",
  "archives", "build", "_dist", "GH_logs", "docs", "inst/doc",
  ".venv", "venv", "vendor", "generated", "__pycache__",
]

[lint]
select = ["E4", "E7", "E9", "F"]
