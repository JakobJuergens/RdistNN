name: lint-style

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  r-lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      had_failure: ${{ steps.outcome.outputs.had_failure }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::lintr

      - name: Run lintr
        id: lint
        run: Rscript tools/ci/lint.R TRUE

      - name: Record lint outcome
        id: outcome
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.lint.outcome }}" == "success" ]]; then
            echo "had_failure=false" >> "$GITHUB_OUTPUT"
          else
            echo "had_failure=true" >> "$GITHUB_OUTPUT"
          fi

  cxx-style:
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      had_failure: ${{ steps.outcome.outputs.had_failure }}
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Check C++ style
        id: style
        run: bash tools/ci/check_cpp_style.sh

      - name: Record C++ style outcome
        id: outcome
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.style.outcome }}" == "success" ]]; then
            echo "had_failure=false" >> "$GITHUB_OUTPUT"
          else
            echo "had_failure=true" >> "$GITHUB_OUTPUT"
          fi

  enforce:
    if: ${{ !cancelled() }}
    needs: [r-lint, cxx-style]
    runs-on: ubuntu-latest
    steps:
      - name: Fail workflow if any style check failed
        shell: bash
        run: |
          set -euo pipefail
          failed=0

          if [[ "${{ needs.r-lint.outputs.had_failure }}" == "true" ]]; then
            echo "::error::R lint failed."
            failed=1
          fi

          if [[ "${{ needs.cxx-style.outputs.had_failure }}" == "true" ]]; then
            echo "::error::C++ style check failed."
            failed=1
          fi

          exit "$failed"

  save_logs:
    if: ${{ !cancelled() && github.actor != 'github-actions[bot]' && (needs.r-lint.outputs.had_failure == 'true' || needs.cxx-style.outputs.had_failure == 'true') }}
    needs: [r-lint, cxx-style]
    uses: ./.github/workflows/harvest-failure-logs.yml
    with:
      logs_dir: GH_logs/lint-style
      harvested_artifact_name: harvested-lint-style-logs
      commit_logs: ${{ github.event_name != 'pull_request' }}
    secrets: inherit
