# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown.yaml

permissions:
  contents: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Upload debug artifact (pkgdown workspace)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-pkgdown-site
          path: |
            docs
            _pkgdown.yml
            DESCRIPTION
            README.md
            README.Rmd
          if-no-files-found: warn
          retention-days: 14

      - name: Deploy to GitHub pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs

  save_logs:
    if: ${{ !cancelled() && always() && needs.pkgdown.result != 'success' && github.actor != 'github-actions[bot]' }}
    needs: [pkgdown]
    uses: ./.github/workflows/harvest-failure-logs.yml
    with:
      logs_dir: GH_logs/pkgdown
      artifact_pattern: debug-pkgdown-*
      harvested_artifact_name: harvested-pkgdown-logs
      commit_logs: ${{ github.event_name != 'release' }}
    secrets: inherit
