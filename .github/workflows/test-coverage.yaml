name: test-coverage

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: write
  actions: read

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: coverage
          extra-packages: |
            any::covr
            any::xml2

      - name: Compute test coverage (Cobertura)
        shell: Rscript {0}
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          print(cov)
          covr::to_cobertura(cov, filename = "cobertura.xml")

            # (optional) Fail early if pushing to protected branches w/o token
      - name: Ensure CODECOV_TOKEN is present on pushes to main/master
        if: ${{ github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'master') }}
        run: |
          if [ -z "${{ secrets.CODECOV_TOKEN }}" ]; then
            echo "CODECOV_TOKEN is required for uploads from protected branches (main/master)."
            exit 1
          fi

      # Upload to Codecov:
      #  - skip fork PRs (no secrets)
      #  - tokenless on public PRs from same repo
      #  - token for pushes (esp. protected branches) or private repos
      - name: Upload coverage to Codecov
        if: ${{ always() && hashFiles('cobertura.xml') != '' && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) }}
        uses: codecov/codecov-action@v4
        with:
          files: ./cobertura.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: ${{ github.event_name != 'pull_request' }}
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}


      - name: Show testthat output
        if: always()
        shell: bash
        run: |
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true

      - name: Upload debug artifact (coverage workspace)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-test-coverage-workspace
          path: |
            ${{ runner.temp }}/package
            cobertura.xml
          if-no-files-found: warn
          retention-days: 14

  save_logs:
    if: ${{ always() && needs.test-coverage.result != 'success' && github.actor != 'github-actions[bot]' }}
    needs: [test-coverage]
    uses: ./.github/workflows/harvest-failure-logs.yml
    with:
      logs_dir: GH_logs
      artifact_pattern: debug-test-coverage-*
      artifact_subdir: test-coverage
      harvested_artifact_name: harvested-test-coverage-logs
      commit_logs: ${{ github.event_name != 'pull_request' }}
    secrets: inherit
