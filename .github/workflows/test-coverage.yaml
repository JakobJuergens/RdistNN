name: test-coverage

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read        # minimal; add pull-requests: write if you want PR comments

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: coverage
          extra-packages: |
            any::covr
            any::xml2

      - name: Compute test coverage (Cobertura)
        shell: Rscript {0}
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          print(cov)
          covr::to_cobertura(cov, filename = "cobertura.xml")

      # Upload to Codecov (tokenless on public PRs; token for private/main)
      - name: Upload coverage to Codecov
        if: ${{ always() && hashFiles('cobertura.xml') != '' }}
        uses: codecov/codecov-action@v4
        with:
          files: ./cobertura.xml
          token: ${{ secrets.CODECOV_TOKEN }}               # required for private repos / non-PRs
          fail_ci_if_error: ${{ github.event_name != 'pull_request' }}
          verbose: true

      - name: Show testthat output
        if: always()
        shell: bash
        run: |
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package
