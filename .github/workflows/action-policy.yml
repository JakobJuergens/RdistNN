name: Action Policy

on:
  workflow_dispatch: {}
  push:
    branches: [ main, master ]
    paths:
      - ".github/workflows/**"
      - ".github/dependabot.yml"
  pull_request:
    branches: [ main, master ]
    paths:
      - ".github/workflows/**"
      - ".github/dependabot.yml"

permissions:
  contents: read

jobs:
  immutable-action-refs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject mutable external action references
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t violations < <(
            grep -RhoE '^[[:space:]]*(-[[:space:]]+)?uses:[[:space:]]*[^[:space:]#]+' .github/workflows \
              | sed -E 's/^[[:space:]]*(-[[:space:]]+)?uses:[[:space:]]*//' \
              | grep -vE '^(\./|docker://)' \
              | grep -vE '@[0-9a-fA-F]{40}$' || true
          )
          if [[ ${#violations[@]} -gt 0 ]]; then
            printf 'Mutable external action reference: %s\n' "${violations[@]}"
            exit 1
          fi
