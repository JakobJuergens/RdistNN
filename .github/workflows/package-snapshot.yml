name: Package source snapshot

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'archives/**'

permissions:
  contents: write
  actions: read

concurrency:
  group: archive-${{ github.ref }}
  cancel-in-progress: false

jobs:
  zip-and-commit:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'github-actions[bot]' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create zip (R, C++, tests, benchmarks)
        id: makezip
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _dist

          # Collect inputs that exist
          paths=()
          for d in R src tests inst/include tools/bench; do
            [[ -d "$d" ]] && paths+=("$d/")
          done
          for f in DESCRIPTION NAMESPACE README.md README.Rmd; do
            [[ -f "$f" ]] && paths+=("$f")
          done

          if [[ ${#paths[@]} -eq 0 ]]; then
            echo "No inputs found (R/, src/, tests/, inst/include, tools/bench, DESCRIPTION, NAMESPACE, README*)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          zip -r _dist/source.zip "${paths[@]}" \
            -x "tests/testthat/_snaps/**" \
               ".git/**" "archives/**" "docs/**" ".github/**"

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "zip_path=_dist/source.zip" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        if: steps.makezip.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: source.zip
          path: ${{ steps.makezip.outputs.zip_path }}
          retention-days: 7

      - name: Replace the single archive in archives/source.zip
        if: steps.makezip.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p archives
          # Remove everything except an optional .gitkeep, then replace with the new zip
          find archives -mindepth 1 -not -name '.gitkeep' -print -delete || true
          cp "${{ steps.makezip.outputs.zip_path }}" "archives/source.zip"

      - name: Commit and push
        if: steps.makezip.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add archives/source.zip
          git commit -m "chore(archive): update source.zip [skip ci]" || exit 0
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          git push origin "HEAD:$BRANCH"

  save_logs:
    if: ${{ always() && github.actor != 'github-actions[bot]' }}
    needs: [zip-and-commit]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and save job logs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LOGS_DIR="GH_logs"
          mkdir -p "$LOGS_DIR"
          rm -f "$LOGS_DIR"/*.txt
          jobs_json=$(gh api \
            "/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
            --paginate)
          echo "$jobs_json" | jq -r '.jobs[] | [.id, .name] | @tsv' \
          | while IFS=$'\t' read -r job_id job_name; do
              safe=$(printf '%s' "$job_name" \
                | sed -E 's|[^A-Za-z0-9._-]+|_|g; s|^_+||; s|_+$||')
              out="$LOGS_DIR/${safe}.txt"
              if gh api "/repos/${{ github.repository }}/actions/jobs/${job_id}/logs" \
                   > "$out" 2>/dev/null; then
                echo "Saved: $job_name -> $(basename "$out")"
              else
                rm -f "$out"
                echo "No log for: $job_name"
              fi
          done

      - name: Commit and push logs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add GH_logs/
          git commit -m "chore(ci): update GH_logs [skip ci]" || exit 0
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          git push origin "HEAD:$BRANCH"
