name: Package source snapshot

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'R/**'
      - 'src/**'
      - 'tests/**'
      - 'inst/include/**'
      - 'tools/bench/**'
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - 'README.md'
      - 'README.Rmd'
      - '.github/workflows/package-snapshot.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: archive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cooldown_gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - name: Enforce workflow cooldown
        id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOW_HOURS: "12"
          TARGET_JOB_NAME: "zip-and-upload"
          CURRENT_RUN_ID: ${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          {
            echo "## Cooldown gate"
            echo "- event: \`$EVENT_NAME\`"
            echo "- cooldown window: \`${WINDOW_HOURS}h\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "reason=manual_dispatch" >> "$GITHUB_OUTPUT"
            echo "- decision: allow heavy jobs (manual dispatch bypass)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if ! current_run="$(gh api "/repos/${{ github.repository }}/actions/runs/${CURRENT_RUN_ID}")"; then
            echo "::warning::Unable to inspect the current workflow run; allowing execution."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "reason=gate_lookup_failed" >> "$GITHUB_OUTPUT"
            echo "- decision: allow heavy jobs (gate lookup failed)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          workflow_id="$(jq -r '.workflow_id' <<<"$current_run")"
          scope_branch="$(jq -r '.head_branch // empty' <<<"$current_run")"
          if [[ -z "$scope_branch" || "$scope_branch" == "null" ]]; then
            scope_branch="$HEAD_REF"
          fi
          if [[ -z "$scope_branch" || "$scope_branch" == "null" ]]; then
            scope_branch="$REF_NAME"
          fi
          scope_repo="$(jq -r '.head_repository.full_name // .repository.full_name // empty' <<<"$current_run")"
          if [[ -z "$scope_repo" || "$scope_repo" == "null" ]]; then
            scope_repo="${{ github.repository }}"
          fi
          cutoff="$(date -u -d "-${WINDOW_HOURS} hours" +"%Y-%m-%dT%H:%M:%SZ")"

          if ! runs_json="$(gh api "/repos/${{ github.repository }}/actions/workflows/${workflow_id}/runs?per_page=50")"; then
            echo "::warning::Unable to inspect recent workflow runs; allowing execution."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "reason=history_lookup_failed" >> "$GITHUB_OUTPUT"
            echo "- decision: allow heavy jobs (history lookup failed)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          candidate_runs="$(jq -c \
            --argjson current "$CURRENT_RUN_ID" \
            --arg event "$EVENT_NAME" \
            --arg branch "$scope_branch" \
            --arg repo "$scope_repo" \
            --arg cutoff "$cutoff" \
            '
              [
                .workflow_runs[]
                | select(.id != $current)
                | select(.event == $event)
                | select((.head_branch // "") == $branch)
                | select((.head_repository.full_name // .repository.full_name // "") == $repo)
                | select(.created_at >= $cutoff)
                | {id, created_at, html_url}
              ]
              | sort_by(.created_at)
              | reverse
            ' <<<"$runs_json")"

          echo "- branch scope: \`$scope_branch\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- repo scope: \`$scope_repo\`" >> "$GITHUB_STEP_SUMMARY"

          last_run=""
          while IFS= read -r candidate; do
            [[ -z "$candidate" ]] && continue
            run_id="$(jq -r '.id' <<<"$candidate")"
            if ! jobs_json="$(gh api "/repos/${{ github.repository }}/actions/runs/${run_id}/jobs?per_page=100" --paginate)"; then
              echo "::warning::Unable to inspect jobs for workflow run ${run_id}; ignoring that run in cooldown history."
              continue
            fi

            if echo "$jobs_json" | jq -e \
              --arg job_name "$TARGET_JOB_NAME" \
              '
                .jobs[]
                | select(.name == $job_name)
                | select(.started_at != null)
                | select(.status == "in_progress" or (.status == "completed" and (.conclusion // "") != "skipped"))
              ' >/dev/null; then
              last_run="$candidate"
              break
            fi
          done < <(jq -c '.[]' <<<"$candidate_runs")

          if [[ -n "$last_run" ]]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "reason=cooled_down" >> "$GITHUB_OUTPUT"
            echo "- decision: skip heavy jobs" >> "$GITHUB_STEP_SUMMARY"
            echo "- prior run within window: \`$(jq -r '.created_at' <<<"$last_run")\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "reason=window_elapsed" >> "$GITHUB_OUTPUT"
            echo "- decision: allow heavy jobs" >> "$GITHUB_STEP_SUMMARY"
          fi

  zip-and-upload:
    needs: cooldown_gate
    if: ${{ needs.cooldown_gate.outputs.should_run == 'true' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create zip (R, C++, tests, benchmarks)
        id: makezip
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _dist

          # Collect inputs that exist
          paths=()
          for d in R src tests inst/include tools/bench; do
            [[ -d "$d" ]] && paths+=("$d/")
          done
          for f in DESCRIPTION NAMESPACE README.md README.Rmd; do
            [[ -f "$f" ]] && paths+=("$f")
          done

          if [[ ${#paths[@]} -eq 0 ]]; then
            echo "No inputs found (R/, src/, tests/, inst/include, tools/bench, DESCRIPTION, NAMESPACE, README*)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          zip -r _dist/source.zip "${paths[@]}" \
            -x "tests/testthat/_snaps/**" \
               ".git/**" "archives/**" "docs/**" ".github/**"

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "zip_path=_dist/source.zip" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        if: steps.makezip.outputs.skip == 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source.zip
          path: ${{ steps.makezip.outputs.zip_path }}
          retention-days: 7

      # The snapshot zip is published as a workflow artifact only (see the
      # upload step above); generated archives are no longer committed to
      # the source tree.

      - name: Upload debug artifact (snapshot workspace)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-package-snapshot-state
          path: |
            _dist
            archives
          if-no-files-found: warn
          retention-days: 14

  save_logs:
    if: ${{ needs.cooldown_gate.outputs.should_run == 'true' && !cancelled() && always() && needs.zip-and-upload.result != 'success' && github.actor != 'github-actions[bot]' }}
    needs: [cooldown_gate, zip-and-upload]
    uses: ./.github/workflows/harvest-failure-logs.yml
    with:
      logs_dir: GH_logs/package-snapshot
      artifact_pattern: debug-package-snapshot-*
      harvested_artifact_name: harvested-package-snapshot-logs
