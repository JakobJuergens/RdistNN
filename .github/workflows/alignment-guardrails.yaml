name: alignment-guardrails

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardrails:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::yaml
            any::roxygen2
            any::Rcpp

      - name: Check test dependency declarations
        run: Rscript tools/ci/check_tests_declared_deps.R

      - name: Check pkgdown reference coverage
        run: Rscript tools/ci/check_pkgdown_reference_coverage.R

      - name: Check generated-file drift
        run: Rscript tools/ci/check_generated_file_drift.R

      - name: Upload debug artifact (alignment state)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-alignment-guardrails-state
          path: |
            DESCRIPTION
            NAMESPACE
            _pkgdown.yml
            R/RcppExports.R
            src/RcppExports.cpp
            man
            tests
            tools/ci
          if-no-files-found: warn
          retention-days: 14

  save_logs:
    if: ${{ !cancelled() && always() && needs.guardrails.result != 'success' && github.actor != 'github-actions[bot]' }}
    needs: [guardrails]
    uses: ./.github/workflows/harvest-failure-logs.yml
    with:
      logs_dir: GH_logs/alignment-guardrails
      artifact_pattern: debug-alignment-guardrails-*
      harvested_artifact_name: harvested-alignment-guardrails-logs
      commit_logs: ${{ github.event_name != 'pull_request' }}
    secrets: inherit
