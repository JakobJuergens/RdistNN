name: alignment-guardrails

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardrails:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          extra-packages: |
            any::yaml
            roxygen2@8.0.0
            any::Rcpp

      - name: Check test dependency declarations
        run: Rscript tools/ci/check_tests_declared_deps.R

      - name: Check repository hygiene
        run: Rscript tools/ci/check_repository_hygiene.R

      - name: Check affine bundle snapshot identity
        run: python3 tests/ci/test_affine_bundle_sync.py

      - name: Check pkgdown reference coverage
        run: Rscript tools/ci/check_pkgdown_reference_coverage.R

      - name: Check generated-file drift
        run: Rscript tools/ci/check_generated_file_drift.R

      - name: Upload debug artifact (alignment state)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-alignment-guardrails-state
          path: |
            DESCRIPTION
            NAMESPACE
            _pkgdown.yml
            R/RcppExports.R
            src/RcppExports.cpp
            man
            tests
            tools/ci
          if-no-files-found: warn
          retention-days: 14

  save_logs:
    if: ${{ !cancelled() && always() && needs.guardrails.result != 'success' && github.actor != 'github-actions[bot]' }}
    needs: [guardrails]
    uses: ./.github/workflows/harvest-failure-logs.yml
    with:
      logs_dir: GH_logs/alignment-guardrails
      artifact_pattern: debug-alignment-guardrails-*
      harvested_artifact_name: harvested-alignment-guardrails-logs
