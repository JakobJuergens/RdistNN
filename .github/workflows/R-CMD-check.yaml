# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: R-CMD-check.yaml

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} / ${{ matrix.config.arch }} (${{ matrix.config.r }})
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        config:
          - os: macos-latest
            arch: arm64
            arch_pattern: 'aarch64|arm64'
            r: release
          - os: macos-15-intel
            arch: x64
            arch_pattern: 'x86_64|x64'
            r: release
          - os: windows-latest
            arch: x64
            arch_pattern: 'x86_64|x64'
            r: release
          - os: ubuntu-latest
            arch: x64
            arch_pattern: 'x86_64|x64'
            r: devel
            http-user-agent: release
          - os: ubuntu-latest
            arch: x64
            arch_pattern: 'x86_64|x64'
            r: release
          - os: ubuntu-latest
            arch: x64
            arch_pattern: 'x86_64|x64'
            r: oldrel-1

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - name: Install XQuartz for Cairo rendering
        if: runner.os == 'macOS'
        run: brew install --cask xquartz

      - name: Verify macOS Cairo PDF device
        if: runner.os == 'macOS'
        shell: Rscript {0}
        run: |
          output <- tempfile(fileext = ".pdf")
          grDevices::cairo_pdf(output)
          graphics::plot.new()
          grDevices::dev.off()
          stopifnot(file.exists(output))

      - name: Verify runner architecture
        shell: Rscript {0}
        env:
          EXPECTED_R_ARCH: ${{ matrix.config.arch_pattern }}
        run: |
          arch <- R.version$arch
          expected <- Sys.getenv("EXPECTED_R_ARCH")
          if (!grepl(expected, arch, ignore.case = TRUE)) {
            stop("Expected architecture matching ", expected, "; got ", arch)
          }

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

      - name: Upload debug artifact (R CMD check state)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debug-rcmdcheck-${{ matrix.config.os }}-${{ matrix.config.r }}
          path: |
            check
            *.Rcheck/**
            *.tar.gz
          if-no-files-found: warn
          retention-days: 14

  save_logs:
    if: ${{ !cancelled() && always() && needs.R-CMD-check.result != 'success' && github.actor != 'github-actions[bot]' }}
    needs: [R-CMD-check]
    uses: ./.github/workflows/harvest-failure-logs.yml
    with:
      logs_dir: GH_logs/rcmdcheck
      artifact_pattern: debug-rcmdcheck-*
      harvested_artifact_name: harvested-rcmdcheck-logs
